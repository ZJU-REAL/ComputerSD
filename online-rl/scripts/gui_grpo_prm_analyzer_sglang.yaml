# Eight rollout GPUs: seven actor engines and one frozen analyzer engine.
# The other eight GPUs in the 16-GPU job are reserved for Megatron training.
sglang:
  - name: actor
    update_weights: true
    server_groups:
      - worker_type: regular
        num_gpus: 4
        num_gpus_per_engine: 1
  - name: ${ANALYZER_MODEL_NAME}
    model_path: ${ANALYZER_MODEL_PATH}
    update_weights: false
    server_groups:
      - worker_type: regular
        num_gpus: 4
        num_gpus_per_engine: 1
